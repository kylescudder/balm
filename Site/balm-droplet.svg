<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dropSage" x1="0.35" y1="0.05" x2="0.6" y2="1">
      <stop offset="0" stop-color="#A9C4AE"/>
      <stop offset="0.55" stop-color="#7C9B83"/>
      <stop offset="1" stop-color="#5C7864"/>
    </linearGradient>
    <radialGradient id="dropSheen" cx="0.36" cy="0.32" r="0.4">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#1F2A22" flood-opacity="0.28"/>
    </filter>
    <clipPath id="dropletClip">
      <path d="M512 170 C512 170 760 440 760 632 A248 248 0 1 1 264 632 C264 440 512 170 512 170 Z"/>
    </clipPath>
  </defs>

  <!-- transparent background; the droplet floats -->
  <g filter="url(#dropShadow)">
    <path fill="url(#dropSage)"
      d="M512 170 C512 170 760 440 760 632 A248 248 0 1 1 264 632 C264 440 512 170 512 170 Z"/>
  </g>

  <!-- glossy highlight, clipped to the droplet -->
  <g clip-path="url(#dropletClip)">
    <ellipse cx="430" cy="450" rx="150" ry="190" fill="url(#dropSheen)" transform="rotate(-16 430 450)"/>
  </g>
</svg>
