name: balm-auth
services:
  balm-auth:
    image: ${BALM_AUTH_IMAGE:?set an immutable Balm auth image reference}
    restart: unless-stopped
    environment:
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:?required}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:?required}
      PORT: "3000"
      NODE_ENV: production
    networks:
      web:
        aliases: [balm-auth]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  web:
    external: true
    name: ${PLATFORM_WEB_NETWORK:-platform-web}
