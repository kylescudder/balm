name: balm-auth
services:
  balm-auth:
    image: ${BALM_AUTH_IMAGE:?set an immutable Balm auth image reference}
    restart: unless-stopped
    environment:
      ATLASSIAN_CLIENT_ID: ${ATLASSIAN_CLIENT_ID:?required}
      ATLASSIAN_CLIENT_SECRET: ${ATLASSIAN_CLIENT_SECRET:?required}
      PORT: '3000'
      NODE_ENV: production
    networks:
      web:
        aliases: [balm-auth]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    # Inherit the health check shipped with the application image.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
networks:
  web:
    external: true
    name: ${PLATFORM_WEB_NETWORK:-platform-web}
