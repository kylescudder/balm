<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#88A88F"/>
      <stop offset="1" stop-color="#5C7864"/>
    </linearGradient>
    <linearGradient id="drop" x1="0.35" y1="0.1" x2="0.65" y2="1">
      <stop offset="0" stop-color="#FCF8EF"/>
      <stop offset="0.6" stop-color="#F4ECDC"/>
      <stop offset="1" stop-color="#EADBC2"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.36" cy="0.34" r="0.42">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#2C3A30" flood-opacity="0.25"/>
    </filter>
    <!-- the droplet silhouette, reused as a clip so the sheen can't spill -->
    <clipPath id="dropClip">
      <path d="M512 250 C512 250 712 470 712 612 A200 200 0 1 1 312 612 C312 470 512 250 512 250 Z"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="229" fill="url(#sage)"/>

  <!-- soft balm droplet: narrow rounded top, full rounded base -->
  <g filter="url(#soft)">
    <path fill="url(#drop)" d="
      M512 250
      C512 250 712 470 712 612
      A200 200 0 1 1 312 612
      C312 470 512 250 512 250 Z"/>
  </g>

  <!-- gentle sheen, clipped to the droplet so it never bleeds onto the green -->
  <g clip-path="url(#dropClip)">
    <ellipse cx="430" cy="470" rx="120" ry="150" fill="url(#sheen)" transform="rotate(-18 430 470)"/>
  </g>
</svg>
