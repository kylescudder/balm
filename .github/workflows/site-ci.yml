name: Marketing CI
on:
  pull_request:
    branches: [main]
    paths:
      - "Site/**"
      - ".github/workflows/site-ci.yml"
      - ".github/workflows/deploy-site.yml"
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install, typecheck, lint, check formatting, build and validate
        run: |
          docker run --rm -v "$PWD/Site:/app" -w /app -e HUSKY=0 -e CI=true -e BUN_CONFIG_MAX_HTTP_REQUESTS=16 \
            oven/bun:1.4.4@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d sh -ec '
              bun install --frozen-lockfile --network-concurrency=16
              bun run typecheck
              bun run lint
              bun run format:check
              bun run build
              bun run check:site'
      - name: Verify the production container without privileges
        run: |
          docker build -t balm-site:ci --build-arg BALM_SITE_REVISION="$GITHUB_SHA" Site
          docker run -d --name balm-site-ci --read-only --cap-drop ALL --security-opt no-new-privileges:true balm-site:ci
          trap 'docker rm -f balm-site-ci' EXIT
          for _attempt in $(seq 20); do
            docker exec balm-site-ci wget -qO /dev/null http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          headers=$(docker exec balm-site-ci wget -S -O /dev/null http://127.0.0.1:8080/healthz 2>&1)
          echo "$headers" | grep -qi "X-Balm-Site-Revision: $GITHUB_SHA"
          docker exec balm-site-ci wget -qO- http://127.0.0.1:8080/ | grep -q 'keyboard-driven Jira client'
          docker exec balm-site-ci wget -qO- http://127.0.0.1:8080/privacy/ | grep -q auth.getbalm.app
          for path in /terms/ /support/; do
            docker exec balm-site-ci wget -qO /dev/null "http://127.0.0.1:8080$path"
          done
          status=$(docker exec balm-site-ci wget -S -O /dev/null http://127.0.0.1:8080/missing-page 2>&1 || true)
          echo "$status" | grep -q '404 Not Found'
