name: Auth CI
on:
  pull_request:
    branches: [main]
    paths: ["Server/**", "deploy/**", "compose.yaml", ".github/workflows/auth-ci.yml", ".github/workflows/deploy-auth.yml"]
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Server tests and typecheck
        run: |
          docker run --rm -v "$PWD/Server:/app" -w /app oven/bun:1.3.13@sha256:87416c977a612a204eb54ab9f3927023c2a3c971f4f345a01da08ea6262ae30e sh -c 'bun install --frozen-lockfile && bun test && bun run typecheck'
      - name: Deployment verification and rollback tests
        run: python3 -B -m unittest discover -s deploy -p 'test_*.py'
      - name: Webhook authentication and queue tests
        run: node --test deploy/receiver/server.test.mjs
